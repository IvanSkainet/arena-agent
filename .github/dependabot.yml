# .github/dependabot.yml
# v4.65.0: weekly dependency-update PRs.
#
# Why now: the v4.61.0-v4.63.0 sweep pinned GitHub Actions to commit
# SHAs (good — those don't float), but the pip dev/runtime deps
# (aiohttp, psutil, websockets, hypothesis, pytest-cov, ruff, mypy)
# are still floating. Dependabot opens a small weekly PR per
# ecosystem with a clean diff against the previous good build,
# so the test matrix + security scan catch a regression before
# the dep lands on master.
#
# Why not pin everything to exact versions:
# - Pip dev deps (hypothesis, pytest-cov, ruff, mypy) are tooling
#   and benefit from staying on the latest minor; security + lint
#   fixes flow through automatically.
# - Runtime deps (aiohttp, psutil, websockets) are already
#   constrained to ">=X.Y" in pyproject.toml, so Dependabot's
#   PRs propose the latest minor and CI validates them.
# - We don't auto-merge; the maintainer reviews the PR + CI run.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    # Keep PR volume down: one per dev dep, group minor+patches
    # for runtime deps so we don't get 6 PRs the same day.
    groups:
      runtime:
        dependency-type: "production"
      dev:
        dependency-type: "development"
    commit-message:
      prefix: "deps"
      include: "scope"
    # Don't update GitHub Actions here — every workflow action is pinned to a
    # reviewed commit SHA, and tag-only bumps are intentionally rejected.
    ignore:
      - dependency-name: "aiohttp"
        # v4.61.0 baseline; bump manually after testing the websocket
        # reconnect path against the new version.
        versions: [">=4.0"]
      - dependency-name: "mutmut"
        # v4.169.31, after PR #5 proposed exactly this. The reason not to
        # take mutmut 3.x was already written at the top of
        # requirements-mutation.in — 3.x copies the tree into mutants/ and
        # breaks this project's imports — but a comment in a .in file is
        # not a machine-readable constraint, so the bot proposed it anyway.
        # Verified again on 3.7.0 rather than trusted: the 3.x CLI aborts
        # before parsing arguments (`mutmut --version` raises
        # FileNotFoundError out of _guess_source_paths), so every
        # invocation scripts/mutation_sweep.py makes would fail. Worse, the
        # sweep is workflow_dispatch-only, so no PR check would ever have
        # executed it — this would have merged green and broken the sweep
        # silently, discoverable only the next time someone ran it by hand.
        versions: [">=3.0"]
      - dependency-name: "mypy"
        # v4.169.32: the package is gone entirely -- it was installed by
        # every CI job and executed by none. This entry is belt and braces
        # in case a transitive dependency drags it back: an upgrade PR for
        # a tool that produces no verdict is pure noise. PR #5 proposed it
        # inside a group, PR #6 proposed it again on its own the moment #5
        # was closed. The [tool.mypy] SECTION in pyproject.toml stays --
        # it is pyrefly's config, guarded by
        # scripts/pyrefly_preset_ratchet.py.
      - dependency-name: "websockets"
        # websockets 17.0 requires Python >= 3.11; this package promises
        # requires-python = ">=3.10" and CI keeps a 3.10 matrix cell to
        # prove it. Raising the floor is a decision about who can install
        # the bridge, not a dependency bump.
        versions: [">=17.0"]
    labels:
      - "dependencies"
      - "automated-pr"
    # PRs stay open for a week so the maintainer has time to read
    # the diff before CI inevitably decides to rebase it.
    open-pull-requests-limit: 5
