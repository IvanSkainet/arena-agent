  # deprecation of the bare form was signalled in v4.69.0
  # (see arena/mcp/tool_registry.py for the catalogue
  # deprecationMessage and arena/mcp/tool_exec.py for the
  # dispatch PendingDeprecationWarning); this job exists so
  # a future maintainer who reaches for a bare name in a NEW
  # code path trips a CI red X at PR time, instead of
  # silently expanding the deprecation surface.
  # ----------------------------------------------------------------
  legacy-name-guard:
    name: 'Legacy bare-name guard (no new dispatch on ping/echo/exec/snapshot)'
    runs-on: ubuntu-latest
    steps:
      # StepSecurity Harden-Runner in AUDIT mode (non-blocking):
      # records network egress / file integrity / processes to the
