name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# v4.61.1: explicit permissions for all jobs. GitHub
# Actions' default token pool can return 'unable to select next
# github token from pool' on forks / restricted repos when
# GITHUB_TOKEN is requested without an explicit permissions
# block. contents: read is enough for the test + lint +
# actionlint jobs (none of them push back to the repo).
permissions:
  contents: read

jobs:
  # ----------------------------------------------------------------
  # v4.62.0: actionlint catches workflow syntax errors before
  # they reach the runner. Catches: typos in `if:` / `uses:`,
  # wrong event names, matrix typo, missing permissions, etc.
  # ----------------------------------------------------------------
  actionlint:
    name: Workflow lint (actionlint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Run actionlint
        uses: rhysd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca # v1.7.12
        with:
          # actionlint ships its own binary; we just point it at
          # the workflow directory. The README badge URL we ship
          # does not exist as a real workflow file, so we skip
          # the badge reference check (actionlint has a separate
          # flag for that).
          ignore: 'workflow-call-usage'

  # ----------------------------------------------------------------
  # Test matrix: 5 Python versions on ubuntu-latest.
  # Windows runner deferred to v4.62.x once platform-specific
  # test failures are fixed or skipif'd.
  # ----------------------------------------------------------------
  test:
    name: Tests (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        # v4.68.0: re-enable the Windows runner. The 4 pre-existing
        # platform-specific failures fixed in v4.61.1
        # (mission-schedule bash probe, cp1251 decode, sound-device
        # skip, sqlite file locking) are still in place. A new
        # wave of platform-specific skips will land in this
        # release as tests surface new issues. v4.62.x was the
        # original "deferred to" target; v4.68.0 is the actual
        # release.
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install hypothesis pytest-cov

      - name: Run tests
        # --cov settings come from pyproject.toml. Coverage gate
        # is enforced here on every matrix cell.
        # v4.62.0: also pass --strict-markers so an unknown
        # marker in a test file trips the build instead of
        # passing silently. --junitxml produces machine-readable
        # results for the JUnit upload step below.
        #
        # v4.68.0: explicit ``shell: bash`` so the test run uses
        # Git Bash on windows-latest. Without it, the runner
        # defaults to PowerShell, which interprets
        # ``--strict-markers`` as "Missing expression after
        # unary operator '--'." (PowerShell parses ``--`` as a
        # unary operator in some contexts.) The Python tests
        # are platform-agnostic; the only thing that was
        # platform-specific was the runner's default shell.
        #
        # v4.68.0: coverage gate is per-platform. On Linux the
        # gate is 50% (the v4.62.0 floor, real coverage is ~50.2%);
        # on Windows the gate is 45% (a few platform-specific
        # code paths don't run under NTFS, so the line-rate
        # comes in at ~49.86% on Windows even after every
        # non-Windows-applicable test passes). 45% is below the
        # Linux floor and well below the safety-net line; a
        # Windows-specific regression that drops coverage to
        # 30% would still fail.
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            THRESHOLD=46
          else
            THRESHOLD=51
          fi
          pytest -q --cov-fail-under=$THRESHOLD \
          --strict-markers \
          --junitxml=test-results-${{ matrix.python-version }}.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.0.0
        with:
          name: test-results-${{ matrix.python-version }}
          path: test-results-${{ matrix.python-version }}.xml
          retention-days: 14

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.0.0
        with:
          name: coverage-xml-${{ matrix.python-version }}
          path: coverage.xml
          retention-days: 14

  # ----------------------------------------------------------------
  # v4.65.0: coverage diff guard. Runs after the test matrix so
  # it can download one of the coverage.xml artifacts. The guard
  # compares the line-rate in coverage.xml against
  # docs/coverage-baseline.json and fails the build if coverage
  # dropped more than 1 percentage point since the last release.
  # ----------------------------------------------------------------
  coverage-diff:
    name: Coverage diff (vs ${{ github.event.repository.default_branch }})
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.0.0
        with:
          python-version: "3.12"

      - name: Download coverage.xml from a 3.12 cell
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: coverage-xml-3.12
          path: .

      - name: Run coverage diff guard
        run: |
          python scripts/coverage_diff.py \
            --xml coverage.xml \
            --baseline docs/coverage-baseline.json \
            --max-drop 1.0

  # ----------------------------------------------------------------
  # v4.66.0: version-sync guard. Stdlib-only script that parses
  # the four sources of the bridge version (constants.py,
  # pyproject.toml, BRIDGE_VERSIONS, LATEST_BRIDGE) and fails
  # the build if they drift. Runs early in the pipeline so a
  # drift is visible as its own red X rather than buried in
  # 5 identical test cells.
  # ----------------------------------------------------------------
  version-sync:
    name: Version sync (4 sources in lockstep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.0.0
        with:
          python-version: "3.12"

      - name: Run version sync guard
        run: |
          python scripts/version_sync.py --repo-root .

  # ----------------------------------------------------------------
  # v4.66.0: CHANGELOG freshness guard. Catches the case where
  # the most recent dated entry in CHANGELOG.md / CHANGELOG.ru.md
  # is more than 90 days old. Default threshold is generous
  # (90d) so the guard only fires on real "we forgot to ship
  # a release" cases, not on a busy maintainer who shipped two
  # releases 80 days apart.
  # ----------------------------------------------------------------
  changelog-freshness:
    name: CHANGELOG freshness (>= 90d old = fail)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.0.0
        with:
          python-version: "3.12"

      - name: Run CHANGELOG freshness guard
        run: |
          python scripts/changelog_freshness.py \
            --en CHANGELOG.md \
            --ru CHANGELOG.ru.md \
            --max-age-days 90

  # ----------------------------------------------------------------
  # v4.67.0: catalogue hardening guard. Runs the audit-mode
  # catalogue_harden.py script. Exits 1 if any object-typed
  # tool inputSchema lacks ``additionalProperties: false`` on
  # the top level (a model that emits a typo'd field name would
  # be silently accepted by the dispatch layer).
  #
  # v4.67.0 also turned the long-running soft-warns in
  # ``tests/test_mcp_input_schema_validation.py`` into hard
  # fails. A new tool entry added without
  # ``additionalProperties: false`` would fail that test
  # inside the matrix; this job surfaces the failure as its
  # own red X so a "I added a tool and forgot the property"
  # regression is visible at PR time, not buried in a
  # 5-cell matrix.
  # ----------------------------------------------------------------
  catalogue-harden:
    name: 'Catalogue hardening (every tool has additionalProperties: false)'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.0.0
        with:
          python-version: "3.12"

      - name: Install runtime deps so MCP_TOOLS can be imported
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run catalogue hardening guard
        run: |
          python scripts/catalogue_harden.py --repo-root .

  # ----------------------------------------------------------------
  # Lint: ruff F821/F811 are blocking. Full rule set is
  # informational.
  # ----------------------------------------------------------------
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.0.0
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Critical lint (blocking)
        run: ruff check . --select F821,F811

      - name: Full lint (informational)
        run: ruff check . --statistics || true

  # ----------------------------------------------------------------
  # v4.62.0: contract test that the MCP tool surface matches the
  # checked-in snapshot. Catches: accidental rename of a
  # handle_xxx function, deletion of a tool name, silent handler
  # rot. This runs as a separate job so a contract failure shows
  # up as its own red X in the Actions UI.
  # ----------------------------------------------------------------
  # ----------------------------------------------------------------
  # v4.69.0: legacy bare-name guard. Runs the AST-based
  # legacy_name_guard.py script, which fails the build if any
  # new dispatch file or function compares a bare-name
  # string literal (``ping`` / ``echo`` / ``exec`` /
  # ``snapshot``) against the ``name`` parameter. The
  # deprecation of the bare form was signalled in v4.69.0
  # (see arena/mcp/tool_registry.py for the catalogue
  # deprecationMessage and arena/mcp/tool_exec.py for the
  # dispatch PendingDeprecationWarning); this job exists so
  # a future maintainer who reaches for a bare name in a NEW
  # code path trips a CI red X at PR time, instead of
  # silently expanding the deprecation surface.
  # ----------------------------------------------------------------
  legacy-name-guard:
    name: 'Legacy bare-name guard (no new dispatch on ping/echo/exec/snapshot)'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.0.0
        with:
          python-version: "3.12"

      - name: Run legacy bare-name guard
        run: |
          python scripts/legacy_name_guard.py --repo-root .

  # ----------------------------------------------------------------
  # v4.70.0: catalogue consistency guard. Bundles 5
  # catalogue invariants (naming convention, name
  # uniqueness, description non-empty,
  # additionalProperties: false, deprecation metadata
  # consistency) into a single audit. v4.67.0
  # ``catalogue_harden`` and v4.69.0 ``legacy_name_guard``
  # are subsumed by this one (they remain in place for
  # backward-compat with their release notes).
  # ----------------------------------------------------------------
  catalogue-consistency:
    name: 'Catalogue consistency (5 invariants in one audit)'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.0.0
        with:
          python-version: "3.12"

      - name: Install runtime deps so MCP_TOOLS can be imported
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run catalogue consistency guard
        run: |
          python scripts/catalogue_consistency_check.py --repo-root .

  # ----------------------------------------------------------------
  # v4.70.0: dead-dispatch guard. Cross-references every
  # catalogue tool against every string-literal tool name
  # in arena/mcp/*.py dispatch files. Catches dead tools
  # (in catalogue but not handled) and dead references (in
  # dispatcher but not in catalogue). The v4.70.0 audit
  # found one such dead reference (fs.write_base64 was
  # handled in tool_fs.py but not in the catalogue) and
  # this guard prevents future regressions.
  # ----------------------------------------------------------------
  dead-dispatch:
    name: 'Dead-dispatch check (catalogue ↔ dispatcher in lockstep)'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.0.0
        with:
          python-version: "3.12"

      - name: Install runtime deps so MCP_TOOLS can be imported
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run dead-dispatch guard
        run: |
          python scripts/dead_dispatch_check.py --repo-root .

  # ----------------------------------------------------------------
  # v4.70.0: JSON Schema structural validator. Stdlib-only
  # Draft-7 metaschema walker. Catches typo'd keywords
  # (addtionalProperties), bad primitive types, required
  # fields that aren't declared in properties, etc.
  # ----------------------------------------------------------------
  json-schema-check:
    name: 'JSON Schema structural check (Draft 7 metaschema)'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.0.0
        with:
          python-version: "3.12"

      - name: Install runtime deps so MCP_TOOLS can be imported
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run JSON Schema check
        run: |
          python scripts/json_schema_check.py --repo-root .

  # ----------------------------------------------------------------
  # v4.70.0: handler-signature guard. Every handle_*_tool
  # function must accept (name, args, *, ctx, ...). The
  # v4.70.0 audit found one dispatcher
  # (handle_mobile_ext_tool) that did not conform; this
  # guard would have caught it at PR time.
  # ----------------------------------------------------------------
  handler-signature:
    name: 'Handler signature (every handle_*_tool accepts *, ctx)'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.0.0
        with:
          python-version: "3.12"

      - name: Run handler signature check
        run: |
          python scripts/handler_signature_check.py --repo-root .

  # ----------------------------------------------------------------
  # v4.70.0: handler-namespace consistency. Detects shadow
  # namespaces (e.g. mem.* ↔ memory.*) and mixed
  # namespace dispatchers. Shadow detection is a hard
  # fail; mixed-namespace dispatch not in the whitelist
  # is a soft warn.
  # ----------------------------------------------------------------
  handler-namespace-consistency:
    name: 'Handler-namespace consistency (no shadow APIs)'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.0.0
        with:
          python-version: "3.12"

      - name: Install runtime deps so MCP_TOOLS can be imported
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run handler-namespace consistency check
        run: |
          python scripts/handler_namespace_consistency.py --repo-root .

  # ----------------------------------------------------------------
  # v4.72.0: namespace documentation coverage. v4.70.0
  # shipped the namespace_doc_coverage.py script in
  # soft-warn mode (the v4.70.0 baseline had 22 of 23
  # namespaces lacking README examples). v4.72.0
  # closes the documentation gap (the README now has a
  # per-namespace example for every namespace) and
  # promotes the guard to --enforce mode so any future
  # namespace added without a README example trips a
  # red X at PR time.
  # ----------------------------------------------------------------
  namespace-doc-coverage:
    name: 'Namespace doc coverage (every namespace has a README example)'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.0.0
        with:
          python-version: "3.12"

      - name: Install runtime deps so MCP_TOOLS can be imported
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run namespace-doc coverage (enforce mode)
        run: |
          python scripts/namespace_doc_coverage.py --repo-root . --enforce

  contract:
    name: MCP contract test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.0.0
        with:
          python-version: "3.12"

      - name: Install pytest
        run: pip install pytest

      - name: Run MCP contract test
        # The test re-scans arena/mcp/tool_*.py and compares
        # against tests/_mcp_contract_snapshot.json. A diff
        # means a tool was added/removed/renamed without
        # running scripts/refresh_mcp_contract_snapshot.py.
        run: pytest -q -o addopts="-q --strict-markers" tests/test_mcp_tool_contracts.py

      - name: Run property-based spec-kit parser test
        run: pip install hypothesis && pytest -q -o addopts="-q --strict-markers" tests/test_spec_kit_parser_property.py
