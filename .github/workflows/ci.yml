        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Lock marker-coverage check
        run: python scripts/check_ci_lock.py

      - name: Lock freshness (.in declares == .lock pins)
        run: python scripts/check_lock_freshness.py

      - name: Install project and CI dependencies (hash-locked)
        run: |
          python -m pip install --require-hashes -r requirements-ci.lock
          python -m pip install --no-deps --no-build-isolation -e .

      - name: Architecture contracts (blocking)
        run: lint-imports --config pyproject.toml

      # Growth of pyrefly/vulture findings is BLOCKING (per-kind floor in
      # scripts/quality_baseline.json); the absolute legacy volume stays
      # visible in the step output on every run.
      - name: Quality debt ratchet (blocking)
        run: python scripts/quality_ratchet.py

      # The residual finding VOLUME is intentionally not reported here:
      # a green job's log output is invisible at the checkmark level.
      # The dedicated `debt-visibility` job (non-blocking, red while any
      # debt remains) owns the backlog signal, including step summaries.

  # ----------------------------------------------------------------
  # v4.62.0: contract test that the MCP tool surface matches the
  # checked-in snapshot. Catches: accidental rename of a
