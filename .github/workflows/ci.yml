name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# v4.61.1: explicit permissions for all jobs. GitHub
# Actions' default token pool can return 'unable to select next
# github token from pool' on forks / restricted repos when
# GITHUB_TOKEN is requested without an explicit permissions
# block. contents: read is enough for the test + lint +
# actionlint jobs (none of them push back to the repo).
permissions:
  contents: read

jobs:
  # ----------------------------------------------------------------
  # v4.62.0: actionlint catches workflow syntax errors before
  # they reach the runner. Catches: typos in `if:` / `uses:`,
  # wrong event names, matrix typo, missing permissions, etc.
  # ----------------------------------------------------------------
  actionlint:
    name: Workflow lint (actionlint)
    runs-on: ubuntu-latest
    steps:
      # StepSecurity Harden-Runner in AUDIT mode (non-blocking):
      # records network egress / file integrity / processes to the
      # StepSecurity dashboard. Chosen as P1 from
      # docs/github_apps_actions_survey.md: this workflow installs
      # hundreds of PyPI packages, so egress visibility matters.
      # Signal route: their dashboard, NOT our red — by design.
      - name: Harden Runner (audit mode, egress visibility)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run actionlint
        uses: rhysd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca # v1.7.12
        # NOTE (v4.96.0): the rhysd/actionlint Docker action only accepts the
        # `entryPoint` and `args` inputs. A stray `with: ignore:` here produced
        # the runner warning "Unexpected input(s) 'ignore', valid inputs are
        # ['entryPoint', 'args']" and was never applied in the first place --
        # actionlint has always run with its default config (and passes). To
        # suppress a specific check, pass actionlint's own flag via `args:`.

      # GitHub retired Node 20 on its runners. The deprecation warning
      # only appears in the log of a job that actually ran, so
      # dependency-review (pull_request only) sat on a dead runtime until
      # Ivan read the log by hand. Offline check: runtimes are recorded
      # per pinned SHA, and a pinned SHA cannot change what it declares.
      - name: Action runtime ratchet (no retired Node runtimes)
        run: python3 scripts/action_runtime_ratchet.py

  # ----------------------------------------------------------------
  # Test matrix: 5 Python versions on ubuntu-latest + windows-latest,
  # plus one macOS smoke cell (3.12). The macOS cell keeps the
  # cross-platform promise alive even though the maintainer has no
  # macOS device locally.
  # ----------------------------------------------------------------
  test:
    name: Tests (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Job-scoped (Scorecard narrowed-top-level doctrine): checkout needs
    # contents:read; id-token:write enables Codecov OIDC upload with no
    # long-lived secret token stored anywhere.
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        # v4.68.0: re-enable the Windows runner. The 4 pre-existing
        # platform-specific failures fixed in v4.61.1
        # (mission-schedule bash probe, cp1251 decode, sound-device
        # skip, sqlite file locking) are still in place. A new
        # wave of platform-specific skips will land in this
        # release as tests surface new issues. v4.62.x was the
        # original "deferred to" target; v4.68.0 is the actual
        # release.
        os: [ubuntu-latest, windows-latest]
        include:
          # v4.89.2: first macOS CI coverage. v4.93.0: macOS now mirrors the
          # full ubuntu/windows Python matrix (3.10-3.14) so the cross-
          # platform promise is checked on every supported Python version,
          # not just a single cell. The per-platform coverage gate below
          # treats macOS like Windows (46% floor).
          - os: macos-latest
            python-version: "3.10"
          - os: macos-latest
            python-version: "3.11"
          - os: macos-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.14"
    steps:
      # StepSecurity Harden-Runner in AUDIT mode (non-blocking):
      # records network egress / file integrity / processes to the
      # StepSecurity dashboard. Chosen as P1 from
      # docs/github_apps_actions_survey.md: this workflow installs
      # hundreds of PyPI packages, so egress visibility matters.
      # Signal route: their dashboard, NOT our red — by design.
      - name: Harden Runner (audit mode, egress visibility)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project and test dependencies
        # Install the project itself, not only a loose requirements file. This
        # catches broken package discovery and makes the tested environment
        # match the documented contributor installation path.
        run: |
          # Every third-party artifact is version- and hash-locked. The
          # editable project install below is local-only and does not resolve
          # or download dependencies.
          python -m pip install --require-hashes -r requirements-ci.lock
          python -m pip install --no-deps --no-build-isolation -e .

      - name: Verify installed package surface
        run: |
          python -c "import arena, unified_bridge; print(arena.__file__); print(unified_bridge.__file__)"

      - name: Run tests
        # --cov settings come from pyproject.toml. Coverage gate
        # is enforced here on every matrix cell.
        # v4.62.0: also pass --strict-markers so an unknown
        # marker in a test file trips the build instead of
        # passing silently. --junitxml produces machine-readable
        # results for the JUnit upload step below.
        #
        # v4.68.0: explicit ``shell: bash`` so the test run uses
        # Git Bash on windows-latest. Without it, the runner
        # defaults to PowerShell, which interprets
        # ``--strict-markers`` as "Missing expression after
        # unary operator '--'." (PowerShell parses ``--`` as a
        # unary operator in some contexts.) The Python tests
        # are platform-agnostic; the only thing that was
        # platform-specific was the runner's default shell.
        #
        # v4.79.0: coverage gate is per-platform. On Linux the
        # gate is 51% (the v4.74.0 floor +1% from the v4.79.0
        # ws_frames/ws_push test lift, real coverage is now
        # ~51.0% on Linux); on Windows the gate is 46% (one
        # notch below the Linux floor, mirroring the
        # 50/45 split established in v4.68.0). The gate still
        # sits well below the safety-net line: a coverage
        # regression that drops Linux to 30% would still
        # fail.
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ] || [ "$RUNNER_OS" = "macOS" ]; then
            THRESHOLD=46
          else
            THRESHOLD=51
          fi
          pytest -q --cov-fail-under=$THRESHOLD \
          --strict-markers \
          --junitxml=test-results-${{ matrix.os }}-${{ matrix.python-version }}.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-${{ matrix.os }}-${{ matrix.python-version }}
          path: test-results-${{ matrix.os }}-${{ matrix.python-version }}.xml
          retention-days: 14

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-xml-${{ matrix.os }}-${{ matrix.python-version }}
          path: coverage.xml
          retention-days: 14

      # P3 (user decision 2026-08-02): external coverage trends via
      # Codecov. All 15 matrix legs upload; Codecov merges the flags.
      # HARD gate on coverage stays HERE (per-platform --cov-fail-under
      # in the Run tests step); Codecov statuses are configured
      # informational-only in codecov.yml, so a Codecov outage or a dip
      # report can never turn our pipeline red — its signal route is the
      # PR comment/dashboard, not our checkmark. fail_ci_if_error:false
      # keeps an external SaaS off our red. Auth: repo upload token in
      # secrets.CODECOV_TOKEN (OIDC was tried first and works equally;
      # token chosen to not depend on id-token exchange).
      # disable_search:true is LOAD-BEARING: with search enabled the
      # Codecov CLI also hoovered up scripts/_testdata/coverage.xml (a
      # legit committed fixture with a days-old timestamp) and Codecov
      # rejected EVERY upload as "exceeds max age of 12h". Never let the
      # uploader scavenge the repo — upload only the fresh pytest report.
      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: ./coverage.xml
          disable_search: true
          flags: ${{ runner.os }}-py${{ matrix.python-version }}
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          verbose: false

  # ----------------------------------------------------------------
  # v4.65.0: coverage diff guard. Runs after the test matrix so
  # it can download one of the coverage.xml artifacts. The guard
  # compares the line-rate in coverage.xml against
  # docs/coverage-baseline.json and fails the build if coverage
  # dropped more than 1 percentage point since the last release.
  # ----------------------------------------------------------------
  coverage-diff:
    name: Coverage diff (vs ${{ github.event.repository.default_branch }})
    runs-on: ubuntu-latest
    needs: test
    steps:
      # StepSecurity Harden-Runner in AUDIT mode (non-blocking):
      # records network egress / file integrity / processes to the
      # StepSecurity dashboard. Chosen as P1 from
      # docs/github_apps_actions_survey.md: this workflow installs
      # hundreds of PyPI packages, so egress visibility matters.
      # Signal route: their dashboard, NOT our red — by design.
      - name: Harden Runner (audit mode, egress visibility)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Download coverage.xml from the ubuntu-latest 3.12 cell
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-xml-ubuntu-latest-3.12
          path: .

      - name: Run coverage diff guard
        run: |
          python scripts/coverage_diff.py \
            --xml coverage.xml \
            --baseline docs/coverage-baseline.json \
            --max-drop 1.0

  # ----------------------------------------------------------------
  # v4.66.0: version-sync guard. Stdlib-only script that parses
  # the four sources of the bridge version (constants.py,
  # pyproject.toml, BRIDGE_VERSIONS, LATEST_BRIDGE) and fails
  # the build if they drift. Runs early in the pipeline so a
  # drift is visible as its own red X rather than buried in
  # 5 identical test cells.
  # ----------------------------------------------------------------
  version-sync:
    name: Version sync (4 sources in lockstep)
    runs-on: ubuntu-latest
    steps:
      # StepSecurity Harden-Runner in AUDIT mode (non-blocking):
      # records network egress / file integrity / processes to the
      # StepSecurity dashboard. Chosen as P1 from
      # docs/github_apps_actions_survey.md: this workflow installs
      # hundreds of PyPI packages, so egress visibility matters.
      # Signal route: their dashboard, NOT our red — by design.
      - name: Harden Runner (audit mode, egress visibility)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Run version sync guard
        run: |
          python scripts/version_sync.py --repo-root .

      # v4.169.10: version-sync proves the four in-repo sources agree.
      # It says nothing about whether that version was ever PUBLISHED --
      # and v4.169.5..9 were all tagged, all green, and all invisible,
      # because auto_update.py reads releases/latest and GitHub only
      # counts published releases there.
      #
      # NOT tag-gated. The first cut was, and it would never have run
      # even once: this workflow triggers on `push: branches: [master]`
      # and on pull_request, so `refs/tags/v*` never matches. A gate
      # wired to a condition that cannot occur is the empty scan for the
      # third release running.
      #
      # Non-strict on purpose: one release of daylight is normal (the
      # version bump lands before the release is cut). Two or more means
      # the publishing step is being skipped, which is the actual defect.
      # v4.169.25: the code-scanning list is not part of any pipeline,
      # so thirteen alerts stayed open across 25 fully-verified releases.
      # Informational below `medium` on purpose: a `note` about
      # 127.0.0.1 in a bridge that listens on loopback is noise, and a
      # gate that fails on noise gets bypassed within a week.
      - name: Open security alerts (fails at medium and above)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/security_alerts_check.py --max-severity medium

      # v4.169.29: the check above asks for state=open, and pressing
      # Dismiss is exactly the act of removing an alert from that query.
      # It reported "no open alerts in any feed" while 294 alerts sat
      # dismissed, 78 of them high or critical -- a button on a web page
      # silently overriding the release gate. Dismissing is still
      # allowed; it now has to arrive as a diff in
      # security_dismissals.json instead of leaving no trace at all.
      - name: Dismissed alerts are recorded in the tree, not just the UI
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/dismissed_alerts_gate.py

      - name: Published releases are not piling up unshipped
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python scripts/release_published_check.py

  # ----------------------------------------------------------------
  # v4.66.0: CHANGELOG freshness guard. Catches the case where
  # the most recent dated entry in CHANGELOG.md / CHANGELOG.ru.md
  # is more than 90 days old. Default threshold is generous
  # (90d) so the guard only fires on real "we forgot to ship
  # a release" cases, not on a busy maintainer who shipped two
  # releases 80 days apart.
  # ----------------------------------------------------------------
  changelog-freshness:
    name: CHANGELOG freshness (>= 90d old = fail)
    runs-on: ubuntu-latest
    steps:
      # StepSecurity Harden-Runner in AUDIT mode (non-blocking):
      # records network egress / file integrity / processes to the
      # StepSecurity dashboard. Chosen as P1 from
      # docs/github_apps_actions_survey.md: this workflow installs
      # hundreds of PyPI packages, so egress visibility matters.
      # Signal route: their dashboard, NOT our red — by design.
      - name: Harden Runner (audit mode, egress visibility)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Run CHANGELOG freshness guard
        run: |
          python scripts/changelog_freshness.py \
            --en CHANGELOG.md \
            --ru CHANGELOG.ru.md \
            --max-age-days 90

  # ----------------------------------------------------------------
  # v4.67.0: catalogue hardening guard. Runs the audit-mode
  # catalogue_harden.py script. Exits 1 if any object-typed
  # tool inputSchema lacks ``additionalProperties: false`` on
  # the top level (a model that emits a typo'd field name would
  # be silently accepted by the dispatch layer).
  #
  # v4.67.0 also turned the long-running soft-warns in
  # ``tests/test_mcp_input_schema_validation.py`` into hard
  # fails. A new tool entry added without
  # ``additionalProperties: false`` would fail that test
  # inside the matrix; this job surfaces the failure as its
  # own red X so a "I added a tool and forgot the property"
  # regression is visible at PR time, not buried in a
  # 5-cell matrix.
  # ----------------------------------------------------------------
  catalogue-harden:
    name: 'Catalogue hardening (every tool has additionalProperties: false)'
    runs-on: ubuntu-latest
    steps:
      # StepSecurity Harden-Runner in AUDIT mode (non-blocking):
      # records network egress / file integrity / processes to the
      # StepSecurity dashboard. Chosen as P1 from
      # docs/github_apps_actions_survey.md: this workflow installs
      # hundreds of PyPI packages, so egress visibility matters.
      # Signal route: their dashboard, NOT our red — by design.
      - name: Harden Runner (audit mode, egress visibility)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install runtime deps so MCP_TOOLS can be imported
        # v4.169.25: requirements.txt carries floors (`aiohttp>=3.14.1`),
        # so this resolved to whatever PyPI served that minute. Every
        # package it lists is already hash-pinned in requirements-ci.lock.
        # Unpinned installs are how a supply-chain swap lands without
        # anything turning red -- Scorecard flagged exactly this.
        run: python -m pip install --require-hashes -r requirements-ci.lock

      - name: Run catalogue hardening guard
        run: |
          python scripts/catalogue_harden.py --repo-root .

  # ----------------------------------------------------------------
  # Lint: ruff F821/F811 are blocking. Full rule set is
  # informational.
  # ----------------------------------------------------------------
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      # StepSecurity Harden-Runner in AUDIT mode (non-blocking):
      # records network egress / file integrity / processes to the
      # StepSecurity dashboard. Chosen as P1 from
      # docs/github_apps_actions_survey.md: this workflow installs
      # hundreds of PyPI packages, so egress visibility matters.
      # Signal route: their dashboard, NOT our red — by design.
      - name: Harden Runner (audit mode, egress visibility)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      # Hash-locked (Scorecard PinnedDependenciesID): ruff version is part
      # of the ratchet contract, so it must not float; the lock file pins
      # the version AND the artifact hashes. Bump deliberately together
      # with scripts/lint_baseline.json.
      - name: Install ruff
        run: python -m pip install --require-hashes -r requirements-lint.lock

      - name: Critical lint (blocking)
        run: ruff check . --select F821,F811

      # Debt ratchet (blocking): legacy lint debt may shrink but never
      # grow. Per-rule floor lives in scripts/lint_baseline.json.
      - name: Lint debt ratchet (blocking)
        run: python scripts/lint_ratchet.py

      - name: Full lint (informational)
        run: ruff check . --statistics || true

  # ----------------------------------------------------------------
  # Packaging E2E (blocking). The worst historical failure class of this
  # repo was "pip install broken while every CI check stayed green" —
  # scanners never saw it, only end-to-end execution did. This job
  # builds the real wheel, validates it (twine, check-wheel-contents
  # with the two expected top-level entries), and installs it into a
  # clean interpreter together with the hash-locked dependencies, then
  # imports it from a NEUTRAL directory (cwd-independent: proves the
  # wheel, not the checkout).
  # ----------------------------------------------------------------
  packaging-e2e:
    name: Packaging E2E (wheel builds and installs clean)
    runs-on: ubuntu-latest
    steps:
      # StepSecurity Harden-Runner in AUDIT mode (non-blocking):
      # records network egress / file integrity / processes to the
      # StepSecurity dashboard. Chosen as P1 from
      # docs/github_apps_actions_survey.md: this workflow installs
      # hundreds of PyPI packages, so egress visibility matters.
      # Signal route: their dashboard, NOT our red — by design.
      - name: Harden Runner (audit mode, egress visibility)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Lock marker-coverage check
        run: python scripts/check_ci_lock.py

      - name: Lock freshness (.in declares == .lock pins)
        run: python scripts/check_lock_freshness.py

      - name: Install packaging + project dependencies (hash-locked)
        run: |
          python -m pip install --require-hashes -r requirements-packaging.lock
          python -m pip install --require-hashes -r requirements-ci.lock

      - name: Build wheel
        run: python -m build --wheel . --outdir dist

      - name: Validate metadata (twine) and wheel layout (check-wheel-contents)
        run: |
          python -m twine check dist/*
          # arena/ + unified_bridge.py shim are the TWO expected entries.
          python -m check_wheel_contents dist/*.whl --toplevel "arena,unified_bridge.py"

      - name: Install wheel into clean path and import from neutral cwd
        run: |
          python -m pip install --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          python -c "import arena, unified_bridge; from arena.constants import VERSION; import arena.admin.auto_update; print('wheel import OK', VERSION)"

  # ----------------------------------------------------------------
  # v4.157.0: browser E2E for /gui. The dashboard is 60 JS files and 17k
  # lines, of which exactly two were ever executed by a test before this
  # job existed -- everything else was checked by reading source text.
  # That cannot see a rendering regression: v4.96.0 shipped a stray
  # </div> that pushed six tabs out of .main, and the guard written
  # afterwards parses HTML, so a CSS-only repeat would sail through.
  # Blocking, because a dashboard that does not render is a broken
  # product, not a warning. ~75s including the browser download.
  # ----------------------------------------------------------------
  dashboard-browser-e2e:
    name: Dashboard browser E2E (real Chromium against a live server)
    runs-on: ubuntu-latest
    steps:
      # StepSecurity Harden-Runner in AUDIT mode (non-blocking):
      # records network egress / file integrity / processes to the
      # StepSecurity dashboard. Chosen as P1 from
      # docs/github_apps_actions_survey.md: this job downloads a browser
      # build, so egress visibility matters.
      # Signal route: their dashboard, NOT our red — by design.
      - name: Harden Runner (audit mode, egress visibility)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install runtime + test deps (hash-locked)
        run: python -m pip install --require-hashes -r requirements-ci.lock

      # Not hash-locked like the rest: the browser is a binary blob fetched
      # by Playwright's own downloader, not a PyPI wheel. The python package
      # itself IS pinned in requirements-ci.lock, and that pin decides which
      # browser build is fetched, so the version is still controlled.
      - name: Install Chromium for Playwright
        run: python -m playwright install --with-deps chromium

      - name: Browser E2E against the live dashboard
        run: python -m pytest tests/e2e/test_dashboard_browser.py -v --no-cov --timeout=300

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dashboard-e2e-artifacts
          path: |
            /tmp/pytest-of-runner/**/*.png
          if-no-files-found: ignore

  # ----------------------------------------------------------------
  # Installed-artifact E2E (blocking), Tier-2. The packaging job above
  # proves the wheel IMPORTS; this job proves the wheel WORKS: the
  # installed artifact is spawned as a real server process and driven
  # over real HTTP/MCP by tests/e2e/test_bridge_live.py (auth, health,
  # MCP handshake, tool call, fs round-trip, jail refusal, teardown).
  # The dot-combo nobody else catches: "unit tests green + wheel
  # imports + server dead on startup".
  # ----------------------------------------------------------------
  e2e-installed:
    name: Installed-artifact E2E (server boots and serves MCP)
    runs-on: ubuntu-latest
    steps:
      # StepSecurity Harden-Runner in AUDIT mode (non-blocking):
      # records network egress / file integrity / processes to the
      # StepSecurity dashboard. Chosen as P1 from
      # docs/github_apps_actions_survey.md: this workflow installs
      # hundreds of PyPI packages, so egress visibility matters.
      # Signal route: their dashboard, NOT our red — by design.
      - name: Harden Runner (audit mode, egress visibility)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Lock marker-coverage check
        run: python scripts/check_ci_lock.py

      - name: Lock freshness (.in declares == .lock pins)
        run: python scripts/check_lock_freshness.py

      - name: Install CI dependencies (hash-locked)
        run: python -m pip install --require-hashes -r requirements-ci.lock

      - name: Install packaging tooling (hash-locked)
        run: python -m pip install --require-hashes -r requirements-packaging.lock

      - name: Build wheel
        run: python -m build --wheel . --outdir dist

      - name: Install wheel into an isolated venv (hash-locked deps)
        run: |
          python -m venv "$RUNNER_TEMP/artifact-venv"
          "$RUNNER_TEMP/artifact-venv/bin/python" -m pip install --quiet --require-hashes -r requirements-ci.lock
          "$RUNNER_TEMP/artifact-venv/bin/python" -m pip install --quiet --no-deps dist/*.whl

      - name: Run live E2E against the INSTALLED artifact
        run: |
          EXPECT=$(python -c "import sys; sys.path.insert(0, '.'); from arena.constants import VERSION; print(VERSION)")
          {
            echo "ARENA_E2E_EXPECT_VERSION=$EXPECT"
            printf 'ARENA_E2E_SERVER_CMD=["%s", "-m", "unified_bridge"]\n' "$RUNNER_TEMP/artifact-venv/bin/python"
          } >> "$GITHUB_ENV"
          ARTIFACT_VERSION=$("$RUNNER_TEMP/artifact-venv/bin/python" -c "from arena.constants import VERSION; print(VERSION)" 2>/dev/null || echo MISSING)
          {
            echo "### Installed-artifact E2E"
            echo "- expected version (repo): \`$EXPECT\`"
            echo "- artifact version (wheel): \`$ARTIFACT_VERSION\`"
          } >> "$GITHUB_STEP_SUMMARY"
          test "$ARTIFACT_VERSION" = "$EXPECT"
          python -m pytest tests/e2e/ --no-cov -q --timeout=300

  # ----------------------------------------------------------------
  # v4.157.0: the JavaScript surface (dashboard/assets + chat_extension,
  # ~17k lines) was linted by NOTHING. semgrep runs on arena/ only and
  # CodeQL is a SAST engine, not a linter -- neither reports
  # no-func-assign or a body on a GET request. The first oxlint run found
  # a real defect: fetch() carried a body on the default GET, which throws
  # TypeError inside the extension service worker. Chosen over
  # Super-Linter / MegaLinter (wrappers) after measuring: 72 files in
  # ~40 ms, see docs/github_apps_actions_survey.md.
  # ----------------------------------------------------------------
  js-lint:
    name: JS lint (oxlint, ratcheted)
    runs-on: ubuntu-latest
    steps:
      # StepSecurity Harden-Runner in AUDIT mode (non-blocking):
      # records network egress / file integrity / processes to the
      # StepSecurity dashboard. Chosen as P1 from
      # docs/github_apps_actions_survey.md: this workflow installs
      # packages from npm, so egress visibility matters.
      # Signal route: their dashboard, NOT our red — by design.
      - name: Harden Runner (audit mode, egress visibility)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm

      # `npm ci` from the committed package-lock.json, not an ad-hoc
      # `npm install oxlint@x`: every entry in that lock carries an integrity
      # hash, which is the same contract the Python side gets from
      # `pip install --require-hashes`. A floating linter would also silently
      # move the floor it is supposed to be guarding.
      #
      # `--ignore-scripts` (v4.163.0) blocks the install-hook class of
      # supply-chain malware outright. The Shai-Hulud wave of 2026-08-04
      # worked exactly that way: a compromised maintainer account published
      # signed releases carrying a `preinstall` entry, so the payload ran
      # during `npm install` before anyone looked at the package. Valid
      # provenance did not help, because the release really was cut by that
      # account's GitHub Actions.
      #
      # Our current lock has zero packages with install scripts, so this
      # flag changes nothing today -- which is the point of adding it today
      # rather than after a transitive dependency brings one in. Verified by
      # execution: `npm ci --ignore-scripts` then `oxlint` on a file with a
      # deliberate `eval()` still reports the violation.
      - name: Install oxlint (hash-locked, no install scripts)
        run: npm ci --no-audit --no-fund --ignore-scripts

      - name: JS lint debt ratchet (blocking)
        run: python3 scripts/js_lint_ratchet.py

      - name: Full JS lint (informational)
        run: npx --no-install oxlint -c .oxlintrc.json dashboard/assets chat_extension || true

  # ----------------------------------------------------------------
  # Debt visibility gate (NON-blocking, red BY DESIGN while any legacy
  # debt remains). Why this exists: the blocking ratchets above gate
  # GROWTH, so their checkmark is green even with the full legacy
  # backlog present — and an AI (or human) skimming the run sees only
  # the checkmark, never the log. This job owns the red X for the
  # residual volume: red = "debt exists", green = "debt zero". It must
  # NOT block merges (continue-on-error) so it never dilutes the
  # meaning of the main red. Doctrine: GREEN main pipeline != zero
  # debt; this job is the noise route for the backlog.
  # ----------------------------------------------------------------
  debt-visibility:
    name: Debt visibility (red while debt > 0; non-blocking)
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      # StepSecurity Harden-Runner in AUDIT mode (non-blocking):
      # records network egress / file integrity / processes to the
      # StepSecurity dashboard. Chosen as P1 from
      # docs/github_apps_actions_survey.md: this workflow installs
      # hundreds of PyPI packages, so egress visibility matters.
      # Signal route: their dashboard, NOT our red — by design.
      - name: Harden Runner (audit mode, egress visibility)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Lock marker-coverage check
        run: python scripts/check_ci_lock.py

      - name: Lock freshness (.in declares == .lock pins)
        run: python scripts/check_lock_freshness.py

      - name: Install project and CI dependencies (hash-locked)
        run: |
          python -m pip install --require-hashes -r requirements-ci.lock
          python -m pip install --no-deps --no-build-isolation -e .

      - name: Debt totals (exit 1 while any debt remains — intentional)
        run: |
          L=0; python scripts/lint_ratchet.py --fail-on-any || L=$?
          Q=0; python scripts/quality_ratchet.py --fail-on-any || Q=$?
          {
            echo ""
            echo "**This job is red by design while legacy debt exists.** It is"
            echo "non-blocking on purpose: growth is blocked separately by the"
            echo "lint/quality ratchet jobs; this one only makes the residual"
            echo "backlog visible at the checkmark level and turns green at zero."
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$L" -ne 0 ] || [ "$Q" -ne 0 ]; then exit 1; fi

  # ----------------------------------------------------------------
  # Quality scan. import-linter contracts are BLOCKING (both verified to
  # hold when declared — a contract that holds is a wall). pyrefly and
  # vulture reached zero in v4.156.0/v4.157.0 and are now ratcheted at a
  # floor of zero, so the informational print here is a cross-check, not
  # the gate: the gate is scripts/quality_ratchet.py. Scope grew to
  # arena + scripts + bin once the latter two were cleared.
  # ----------------------------------------------------------------
  quality-scan:
    name: Quality scan (types/dead-code info, architecture contracts blocking)
    runs-on: ubuntu-latest
    steps:
      # StepSecurity Harden-Runner in AUDIT mode (non-blocking):
      # records network egress / file integrity / processes to the
