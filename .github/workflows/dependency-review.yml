name: Dependency Review

on:
  pull_request:
    branches: [master]

permissions:
  contents: read
  # The action posts its findings as a PR comment; without this it logs
  # "Unable to write summary to pull-request" and the report is lost.
  pull-requests: write

jobs:
  dependency-review:
    name: Dependency review (block new CVEs in PRs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          persist-credentials: false

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294  # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: always
