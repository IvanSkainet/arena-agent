name: Mutation sweep (manual, long-running)

# Answering the operator's question directly: a new commit does NOT cancel
# this run. Cancellation comes from `cancel-in-progress: true` within a
# concurrency GROUP, and ci.yml's group is `ci-${{ github.ref }}`. This
# workflow has its own group and does not cancel in progress, so pushing
# to master while a sweep is running leaves the sweep alone -- it keeps
# grinding the commit it started from, which is what makes its result
# meaningful.
#
# It is workflow_dispatch only. A sweep costs hours; nobody wants it on
# every push, and the result belongs in an artifact where it can be read
# later rather than scrolling past in a chat.
on:
  workflow_dispatch:
    inputs:
      paths:
        description: "Comma-separated files to mutate (blank = the mutation_gate TARGETS)"
        required: false
        default: ""
      scope:
        description: "targets = the mutation_gate list; all = every module under arena/"
        required: false
        default: targets
        type: choice
        options: [targets, all]
      shards:
        description: "How many parallel shards to split the sweep across"
        required: false
        default: "8"

permissions: {}

concurrency:
  # Separate from ci-*; two sweeps queue rather than fight, and a normal
  # CI run cannot cancel one.
  group: mutation-sweep
  cancel-in-progress: false

jobs:
  # Ivan asked for a sweep across the whole codebase and accepted that it
  # is slow. Slow is handled by splitting the work, not by narrowing it:
  # 620 modules against a 350-minute job ceiling does not fit in one
  # runner, so the file list is dealt round-robin across N shards that
  # run in parallel. `fail-fast: false` because a shard that dies still
  # leaves the other seven with real results worth reading.
  plan:
    timeout-minutes: 10
    name: Plan the shards
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Build the shard list
        id: plan
        env:
          SHARDS: ${{ inputs.shards }}
        run: |
          set -euo pipefail
          case "$SHARDS" in
            ''|*[!0-9]*) echo "shards must be a positive integer" >&2; exit 1 ;;
          esac
          # v4.169.34: if/then form -- the A && B || C idiom trips
          # SC2015 (shellcheck 0.10 flags the brace-group form; the CI
          # image pins an older one and stays green today, but that is
          # luck, not policy). Keep "shellcheck" out of leading comment
          # position here: it parses as a directive and breaks the lint.
          if [ "$SHARDS" -lt 1 ] || [ "$SHARDS" -gt 20 ]; then
            echo "shards must be between 1 and 20" >&2; exit 1
          fi
          list=$(seq 1 "$SHARDS" | paste -sd, -)
          echo "matrix={\"shard\":[$list],\"total\":[$SHARDS]}" >> "$GITHUB_OUTPUT"

  sweep:
    name: Mutate and report survivors
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 350   # under the 360-minute job ceiling
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Harden Runner (audit mode, egress visibility)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          set -euo pipefail
          # No `pip install --upgrade pip`: an unhashed install in a
          # workflow is a Scorecard PinnedDependenciesID finding, and the
          # runner's pip is already new enough to honour --require-hashes.
          # Same install path CI uses. The first version of this step did
          # `pip install -r requirements.txt || true`, which swallowed the
          # failure: only pytest landed, every mutated test run died on a
          # missing aiohttp, and mutmut reported 0 mutants for all nine
          # targets in five seconds. The report said "ran" with a straight
          # face -- a fail-open in the very tooling written to find
          # fail-opens. No `|| true` here.
          python -m pip install --require-hashes -r requirements-ci.lock
          python -m pip install --no-deps --no-build-isolation -e .
          # mutmut 2.5.1, not 3.x: 3.x copies the tree into mutants/ and
          # breaks our imports. Measured, not assumed. Hash-locked in
          # requirements-mutation.lock for the same reason as every other
          # install here -- `pip install "mutmut==2.5.1"` pins the version
          # but not the artefact, and opened two alerts on this very
          # workflow the day it landed.
          python -m pip install --require-hashes -r requirements-mutation.lock

      - name: Prove the suite runs before mutating anything
        run: |
          set -euo pipefail
          # A baseline that cannot pass makes every mutant "survive" (or
          # every run collapse to zero), so check it explicitly rather
          # than inferring it from the numbers afterwards.
          python -m pytest tests/test_mobile_apk_upload_stays_in_staging.py \
            -q --no-cov -p no:randomly --timeout=120

      - name: Record the commit under test
        run: |
          set -euo pipefail
          echo "Sweeping ${GITHUB_SHA}" | tee sweep-header.txt
          echo "Started $(date -u +%FT%TZ)" | tee -a sweep-header.txt

      - name: Run the sweep
        id: sweep
        env:
          SWEEP_PATHS: ${{ inputs.paths }}
          SWEEP_SCOPE: ${{ inputs.scope }}
          SHARD: ${{ matrix.shard }}
          SHARD_TOTAL: ${{ matrix.total }}
        run: |
          # No `continue-on-error`, and `-e` so a non-zero exit reddens the
          # step. Sweep #1 reported "ran 0 0 0" for every target and the
          # run was green, because the script always returned 0 and this
          # step swallowed it anyway. The whole point of the sweep is to
          # be believed, which requires it to be able to say "no".
          set -euo pipefail
          scope_flag=""
          if [ "${SWEEP_SCOPE:-targets}" = "all" ]; then scope_flag="--all"; fi
          # Leave ~40 minutes of the 350-minute ceiling for reporting and
          # artifact upload; files not reached are listed as such rather
          # than silently omitted.
          python scripts/mutation_sweep.py \
            ${SWEEP_PATHS:+--paths "$SWEEP_PATHS"} \
            $scope_flag \
            --shard "${SHARD}/${SHARD_TOTAL}" \
            --deadline-minutes 310 \
            --report mutation-report.md \
            --json mutation-report.json

      - name: Summarise into the job summary
        if: always()
        run: |
          set -euo pipefail
          {
            cat sweep-header.txt
            echo
            if [ -f mutation-report.md ]; then
              cat mutation-report.md
            else
              echo "No report produced -- see the step log."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-report-shard-${{ matrix.shard }}
          path: |
            mutation-report.md
            mutation-report.json
            sweep-header.txt
          retention-days: 90
          if-no-files-found: warn
