# Re-run a CI run whose only problem is that GitHub never started some jobs.
#
# GitHub cancels a queued macOS job when no runner takes it ("The job was not
# acquired by Runner of type hosted even after multiple attempts"). The
# "CI required" gate then fails, correctly, and master or a pull request goes
# red with no failing test. A person had to press "Re-run failed jobs" (#565).
#
# This workflow presses it, under three limits written in
# .github/scripts/retry_never_started.py:
#   * only when a job carries that exact message;
#   * never when any job ran and failed;
#   * at most two retries per run.
#
# Two triggers, one behaviour.
#
# workflow_run fires when a CI run completes. This is the one that matters:
# a pull request waiting to merge needs the retry within minutes.
#
# The schedule is a fallback. It was the only trigger at first, on the
# assumption that it costs a delay of one tick. That assumption was wrong
# for this repository: scheduled workflows here start 7.5 to 11 hours after
# their cron time (#565), and in its first hours the schedule never fired.
#
# Either way the script does the same thing: it lists the CI runs that
# failed recently and looks at each. The event is only a wake-up call.
#
# Why workflow_run is safe here, although zizmor reports the trigger:
#   * the job checks out the default branch, never the code of the run that
#     triggered it;
#   * it downloads no artifact from that run;
#   * it reads one value from the event, the conclusion, and only in the
#     job's `if`. Nothing from the event reaches the script.
# tests/test_retry_never_started.py holds the workflow to these three points.
#
# One copy at a time. Two copies looking at the same run could each re-run
# it and pass the limit on attempts. All starts share one concurrency group.
# GitHub keeps one waiting start per group and drops the older waiting ones;
# that loses nothing, because every start looks at every recent failed run.
name: Retry jobs GitHub never started

on:
  workflow_run:  # zizmor: ignore[dangerous-triggers] default-branch code only, no artifacts; see the comment above
    workflows: ["CI"]
    types: [completed]
  schedule:
    - cron: "37 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: retry-never-started
  cancel-in-progress: false

jobs:
  retry:
    name: Re-run CI runs whose jobs were never started
    # Only a failed CI run is worth waking up for. A run that a person
    # cancelled ends with 'cancelled', a good one with 'success'.
    if: >-
      github.repository == 'IvanSkainet/arena-agent' &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write  # re-run the failed jobs of a run
      checks: read    # read why a job was cancelled
      contents: read  # check out the script
    steps:
      - name: Harden Runner (block mode, egress enforced)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443

      - name: Check out the script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Look at recent failed CI runs and re-run the ones GitHub never started
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/retry_never_started.py
