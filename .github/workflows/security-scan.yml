name: Security scan

# Runs on every push to master and every PR, plus daily at 06:00 UTC
# so a new CVE in one of our deps trips the alert even without a
# new commit.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

concurrency:
  group: security-scan-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  bandit:
    timeout-minutes: 10
    name: bandit (must be 0 HIGH / 0 MEDIUM)
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner (block mode, egress enforced)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: block
          # Wave 2 of moving off audit mode (#217 piloted three jobs).
          # Anything outside this list is exfiltration or a compromised
          # action, and is dropped rather than merely logged.
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            pypi.org:443
            files.pythonhosted.org:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      # v4.169.25: was `pip install "bandit>=1.7"`. A security scan
      # that resolves its own scanner from an unpinned range decides
      # what counts as secure using code nobody reviewed. Scorecard
      # flagged the pattern; requirements-security.lock pins all three.
      - name: Install bandit (hash-pinned)
        run: python -m pip install --require-hashes -r requirements-security.lock

      - name: Run bandit
        # -r arena/  = recursive scan of the runtime module.
        # --skip B101 = ignore assert-used; we use asserts inside tests.
        # We do NOT scan tests/ so per-line # nosec markers on test
        # fixtures don't need to be re-annotated (test fixtures often
        # need deliberately-vulnerable shapes to prove they get
        # rejected).
        run: |
          set +e
          bandit -r arena/ --skip B101 -f json -o bandit.json
          scanner_rc=$?
          set -e
          python3 scripts/scanner_contract_gate.py \
            --tool bandit --exit-code "$scanner_rc" --allowed-exits 0,1

      - name: Gate on HIGH + MEDIUM, ratchet LOW downward
        # Delegates to the shared gate script so CI and `make
        # security-scan` locally apply the exact same threshold.
        # HIGH/MEDIUM are zero-tolerance. LOW used to be ignored
        # entirely, which hid 496 findings -- 250 of them B110
        # try_except_pass, the fail-open shape this repo keeps
        # fighting. LOW is now capped by docs/bandit-low-ceiling.txt
        # and may only go down.
        run: python3 scripts/security_gate.py bandit bandit.json

      - name: Upload bandit report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: bandit-report
          path: bandit.json
          retention-days: 30

  semgrep:
    timeout-minutes: 15
    name: semgrep (9 rule packs, must be 0 findings)
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner (block mode, egress enforced)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: block
          # Wave 2 of moving off audit mode (#217 piloted three jobs).
          # Anything outside this list is exfiltration or a compromised
          # action, and is dropped rather than merely logged.
          # semgrep fetches its nine rule packs from semgrep.dev at run time.
          # metrics.semgrep.dev is deliberately NOT listed: block mode caught
          # the scanner phoning telemetry home, and SEMGREP_SEND_METRICS=off
          # stops it at the source.
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            pypi.org:443
            files.pythonhosted.org:443
            semgrep.dev:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install semgrep (hash-pinned)
        run: python -m pip install --require-hashes -r requirements-security.lock

      - name: Run semgrep
        # Every finding must be a real ERROR/WARNING. Rule that fires
        # on an OK line is silenced via inline
        # `# nosemgrep: <rule> -- <reason>`, which each existing
        # annotation follows. New nosemgrep additions in a PR require
        # a rationale (grep-visible in code review).
        env:
          SEMGREP_SEND_METRICS: "off"
        run: |
          set +e
          semgrep \
            --config=p/python \
            --config=p/security-audit \
            --config=p/owasp-top-ten \
            --config=p/cwe-top-25 \
            --config=p/insecure-transport \
            --config=p/command-injection \
            --config=p/xss \
            --config=p/secrets \
            --config=p/gitleaks \
            --error --severity=ERROR --severity=WARNING \
            --timeout=120 \
            --json --output=semgrep.json \
            arena/
          scanner_rc=$?
          set -e
          python3 scripts/scanner_contract_gate.py \
            --tool semgrep --exit-code "$scanner_rc" --allowed-exits 0,1

      - name: Gate on any ERROR + WARNING
        run: python3 scripts/security_gate.py semgrep semgrep.json

      - name: Upload semgrep report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: semgrep-report
          path: semgrep.json
          retention-days: 30

  trufflehog:
    timeout-minutes: 10
    name: trufflehog (0 secrets in git history)
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner (block mode, egress enforced)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: block
          # scans history already on disk, but ships as a Docker action, so
          # the image has to be pulled from GHCR first. Confirmed from a real
          # run: without ghcr.io the job dies with "dial tcp ...: connection
          # refused" before it scans anything.
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            ghcr.io:443
            pkg-containers.githubusercontent.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # full history for secret scanning
          persist-credentials: false

      - name: Run trufflehog
        uses: trufflesecurity/trufflehog@6f3c981e7b77f235fd2702dd74af25fc4b72bf11 # v3.96.0
        with:
          # Policy: every verified credential is blocking. Unverified detector
          # hits are intentionally excluded rather than hidden after execution.
          extra_args: --only-verified --json

  gitleaks:
    timeout-minutes: 5
    name: gitleaks (0 secrets in commits)
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner (block mode, egress enforced)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: block
          # scans commits already on disk.
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e  # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  security-alerts:
    timeout-minutes: 5
    name: security alerts (0 open alerts in CodeQL, Dependabot, Secret Scanning)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: read
    steps:
      - name: Harden Runner (block mode, egress enforced)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: block
          # Wave 2 of moving off audit mode (#217 piloted three jobs).
          # Anything outside this list is exfiltration or a compromised
          # action, and is dropped rather than merely logged.
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Check GitHub security alerts feed
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/security_alerts_check.py --max-severity medium
          python3 scripts/dismissed_alerts_gate.py

  osv-scanner:
    timeout-minutes: 10
    name: osv-scanner (Google OSV vulnerability database)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden Runner (block mode, egress enforced)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: block
          # queries the OSV database, uploads SARIF.
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
            productionresultssa0.blob.core.windows.net:443
            productionresultssa1.blob.core.windows.net:443
            productionresultssa2.blob.core.windows.net:443
            productionresultssa3.blob.core.windows.net:443
            productionresultssa4.blob.core.windows.net:443
            productionresultssa5.blob.core.windows.net:443
            productionresultssa6.blob.core.windows.net:443
            productionresultssa7.blob.core.windows.net:443
            productionresultssa8.blob.core.windows.net:443
            productionresultssa9.blob.core.windows.net:443
            osv-vulnerabilities.storage.googleapis.com:443
            api.osv.dev:443
            api.deps.dev:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run OSV-Scanner
        uses: google/osv-scanner-action/osv-scanner-action@8deb546fdb875b9996d27d4950be7312dac076a1 # v2.5.0
        with:
          # Policy: any known vulnerability is blocking. JSON is retained so
          # no-packages (128), execution errors (127), and findings (1) remain
          # distinguishable in the report/log instead of one ignored exit.
          scan-args: |-
            --recursive
            --format=json
            --output-file=osv-results.json
            .

      - name: Validate OSV JSON report
        if: always()
        run: python3 scripts/scanner_contract_gate.py --tool osv --report osv-results.json --format osv --block finding

      - name: Upload OSV report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: osv-report
          path: osv-results.json
          if-no-files-found: error
          retention-days: 30

  sbom-and-grype:
    timeout-minutes: 10
    name: SBOM + Grype vulnerability scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden Runner (audit mode, egress visibility)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Generate SBOM with Syft
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          format: cyclonedx-json
          output-file: sbom.cyclonedx.json

      - name: Validate CycloneDX SBOM
        if: always()
        run: python3 scripts/scanner_contract_gate.py --tool syft --report sbom.cyclonedx.json --format cyclonedx

      - name: Scan SBOM with Grype
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2  # v7.4.0
        with:
          sbom: sbom.cyclonedx.json
          # Policy: Critical is blocking; High and below remain visible in the
          # retained JSON report without being confused with scanner failure.
          fail-build: false
          severity-cutoff: critical
          output-format: json
          output-file: grype.json

      - name: Gate Grype Critical findings and validate report
        if: always()
        run: python3 scripts/scanner_contract_gate.py --tool grype --report grype.json --format grype --block critical

      - name: Upload SBOM and Grype reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: sbom-and-grype-reports
          path: |
            sbom.cyclonedx.json
            grype.json
          if-no-files-found: error
          retention-days: 30

  socket-firewall:
    timeout-minutes: 10
    name: Socket Firewall (supply-chain malware detection)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden Runner (audit mode, egress visibility)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Socket Firewall
        uses: SocketDev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        with:
          mode: firewall-free

      - name: Safe pip install
        # Policy: any Socket firewall refusal is blocking. A missing/broken sfw
        # executable is an execution failure and must also make the job red.
        run: |
          python3 scripts/extract_runtime_reqs.py > runtime-reqs.txt
          test -s runtime-reqs.txt
          command -v sfw
          sfw pip install -r runtime-reqs.txt

  devskim:
    timeout-minutes: 10
    name: DevSkim (Microsoft security linter)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden Runner (block mode, egress enforced)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: block
          # static linter; uploads a SARIF artifact.
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
            productionresultssa0.blob.core.windows.net:443
            productionresultssa1.blob.core.windows.net:443
            productionresultssa2.blob.core.windows.net:443
            productionresultssa3.blob.core.windows.net:443
            productionresultssa4.blob.core.windows.net:443
            productionresultssa5.blob.core.windows.net:443
            productionresultssa6.blob.core.windows.net:443
            productionresultssa7.blob.core.windows.net:443
            productionresultssa8.blob.core.windows.net:443
            productionresultssa9.blob.core.windows.net:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run DevSkim
        uses: microsoft/DevSkim-Action@4b5047945a44163b94642a1cecc0d93a3f428cc6  # v1.0.16
        with:
          directory-to-scan: .
          should-scan-archives: false
          # Two JSON data files contain only mutation-test paths or a pinned
          # public commit SHA; JSON cannot carry DevSkim same-line suppressions.
          ignore-globs: "**/.git/**,**/bin/**,**/tests/**,**/docs/**,**/.venv/**,**/scripts/mutation_cache.json,**/integrations/book_of_eternity_compatibility.json"

      - name: Validate DevSkim SARIF and gate errors
        if: always()
        # Policy: SARIF error blocks. Warning/note findings remain visible in
        # the retained report and are advisory, not execution failures.
        run: python3 scripts/scanner_contract_gate.py --tool devskim --report devskim-results.sarif --format sarif --block error

      - name: Upload DevSkim report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: devskim-report
          path: devskim-results.sarif
          if-no-files-found: error
          retention-days: 30

  pip-audit:
    timeout-minutes: 10
    name: pip-audit (0 CVE in runtime deps)
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner (block mode, egress enforced)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: block
          # Wave 2 of moving off audit mode (#217 piloted three jobs).
          # Anything outside this list is exfiltration or a compromised
          # action, and is dropped rather than merely logged.
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            pypi.org:443
            files.pythonhosted.org:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pip-audit (hash-pinned)
        run: python -m pip install --require-hashes -r requirements-security.lock

      - name: Extract runtime deps from pyproject.toml
        # Same helper the Makefile uses, so drift between local +
        # CI runs is impossible.
        run: |
          python3 scripts/extract_runtime_reqs.py > runtime-reqs.txt
          cat requirements-ci.in requirements-packaging.in >> runtime-reqs.txt
          test -s runtime-reqs.txt

      - name: Run pip-audit
        run: |
          set +e
          pip-audit --requirement runtime-reqs.txt --format json \
              --output pip-audit.json
          scanner_rc=$?
          set -e
          python3 scripts/scanner_contract_gate.py \
            --tool pip-audit --exit-code "$scanner_rc" --allowed-exits 0,1

      - name: Gate on any CVE
        run: python3 scripts/security_gate.py pip-audit pip-audit.json

      - name: Upload pip-audit report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: pip-audit-report
          path: pip-audit.json
          retention-days: 30

  # One stable target for branch rules. T40 will make currently advisory
  # scanners distinguish findings from execution failures; this aggregate is
  # already fail-closed about job wiring and conclusions.
  security-required:
    timeout-minutes: 5
    name: Security required
    if: ${{ always() }}
    needs:
      - bandit
      - semgrep
      - trufflehog
      - gitleaks
      - security-alerts
      - osv-scanner
      - sbom-and-grype
      - socket-firewall
      - devskim
      - pip-audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fail closed unless every security job succeeded
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: >-
          python3 .github/scripts/required_jobs_gate.py
          --expected
          "bandit,semgrep,trufflehog,gitleaks,security-alerts,osv-scanner,sbom-and-grype,socket-firewall,devskim,pip-audit"
