name: Security scan

# Runs on every push to master and every PR, plus daily at 06:00 UTC
# so a new CVE in one of our deps trips the alert even without a
# new commit.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: "0 6 * * *"

concurrency:
  group: security-scan-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  bandit:
    name: bandit (must be 0 HIGH / 0 MEDIUM)
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner (audit mode, egress visibility)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      # v4.169.25: was `pip install "bandit>=1.7"`. A security scan
      # that resolves its own scanner from an unpinned range decides
      # what counts as secure using code nobody reviewed. Scorecard
      # flagged the pattern; requirements-security.lock pins all three.
      - name: Install bandit (hash-pinned)
        run: python -m pip install --require-hashes -r requirements-security.lock

      - name: Run bandit
        # -r arena/  = recursive scan of the runtime module.
        # --skip B101 = ignore assert-used; we use asserts inside tests.
        # We do NOT scan tests/ so per-line # nosec markers on test
        # fixtures don't need to be re-annotated (test fixtures often
        # need deliberately-vulnerable shapes to prove they get
        # rejected).
        run: |
          bandit -r arena/ --skip B101 -f json -o bandit.json || true

      - name: Gate on HIGH + MEDIUM (LOW allowed as code hygiene)
        # Delegates to the shared gate script so CI and `make
        # security-scan` locally apply the exact same threshold.
        run: python3 scripts/security_gate.py bandit bandit.json

      - name: Upload bandit report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: bandit-report
          path: bandit.json
          retention-days: 30

  semgrep:
    name: semgrep (9 rule packs, must be 0 findings)
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner (audit mode, egress visibility)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install semgrep (hash-pinned)
        run: python -m pip install --require-hashes -r requirements-security.lock

      - name: Run semgrep
        # Every finding must be a real ERROR/WARNING. Rule that fires
        # on an OK line is silenced via inline
        # `# nosemgrep: <rule> -- <reason>`, which each existing
        # annotation follows. New nosemgrep additions in a PR require
        # a rationale (grep-visible in code review).
        run: |
          semgrep \
            --config=p/python \
            --config=p/security-audit \
            --config=p/owasp-top-ten \
            --config=p/cwe-top-25 \
            --config=p/insecure-transport \
            --config=p/command-injection \
            --config=p/xss \
            --config=p/secrets \
            --config=p/gitleaks \
            --error --severity=ERROR --severity=WARNING \
            --json --output=semgrep.json \
            arena/ || true

      - name: Gate on any ERROR + WARNING
        run: python3 scripts/security_gate.py semgrep semgrep.json

      - name: Upload semgrep report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: semgrep-report
          path: semgrep.json
          retention-days: 30

  trufflehog:
    name: trufflehog (0 secrets in git history)
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner (audit mode, egress visibility)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # full history for secret scanning
          persist-credentials: false

      - name: Run trufflehog
        uses: trufflesecurity/trufflehog@6f3c981e7b77f235fd2702dd74af25fc4b72bf11 # v3.96.0
        with:
          extra_args: --only-verified --json
        continue-on-error: true

  gitleaks:
    name: gitleaks (0 secrets in commits)
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner (audit mode, egress visibility)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e  # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  security-alerts:
    name: security alerts (0 open alerts in CodeQL, Dependabot, Secret Scanning)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: read
    steps:
      - name: Harden Runner (audit mode, egress visibility)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Check GitHub security alerts feed
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/security_alerts_check.py --max-severity medium
          python3 scripts/dismissed_alerts_gate.py

  osv-scanner:
    name: osv-scanner (Google OSV vulnerability database)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden Runner (audit mode, egress visibility)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run OSV-Scanner
        uses: google/osv-scanner-action/osv-scanner-action@8deb546fdb875b9996d27d4950be7312dac076a1 # v2.5.0
        with:
          scan-args: |-
            --recursive
            .
        continue-on-error: true  # advisory, don't block CI

  sbom-and-grype:
    name: SBOM + Grype vulnerability scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden Runner (audit mode, egress visibility)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Generate SBOM with Syft
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        continue-on-error: true
        with:
          format: cyclonedx-json
          output-file: sbom.cyclonedx.json

      - name: Scan SBOM with Grype
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2  # v7.4.0
        continue-on-error: true
        with:
          sbom: sbom.cyclonedx.json
          fail-build: false  # advisory
          severity-cutoff: critical

      - name: Upload SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        continue-on-error: true
        with:
          name: sbom-cyclonedx
          path: sbom.cyclonedx.json
          retention-days: 30

  socket-firewall:
    name: Socket Firewall (supply-chain malware detection)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden Runner (audit mode, egress visibility)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Socket Firewall
        uses: SocketDev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        with:
          mode: firewall-free

      - name: Safe pip install
        run: |
          python3 scripts/extract_runtime_reqs.py > runtime-reqs.txt
          sfw pip install -r runtime-reqs.txt
        continue-on-error: true

  devskim:
    name: DevSkim (Microsoft security linter)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Harden Runner (audit mode, egress visibility)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run DevSkim
        uses: microsoft/DevSkim-Action@4b5047945a44163b94642a1cecc0d93a3f428cc6  # v1.0.16
        with:
          directory-to-scan: .
          should-scan-archives: false
          ignore-globs: "**/.git/**,**/bin/**,**/tests/**,**/docs/**,**/.venv/**"
        continue-on-error: true

      - name: Upload DevSkim SARIF
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        if: always()
        continue-on-error: true  # SARIF may not exist if DevSkim found no issues
        with:
          sarif_file: devskim-results.sarif
          category: devskim

  pip-audit:
    name: pip-audit (0 CVE in runtime deps)
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner (audit mode, egress visibility)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pip-audit (hash-pinned)
        run: python -m pip install --require-hashes -r requirements-security.lock

      - name: Extract runtime deps from pyproject.toml
        # Same helper the Makefile uses, so drift between local +
        # CI runs is impossible.
        run: |
          python3 scripts/extract_runtime_reqs.py > runtime-reqs.txt
          cat requirements-ci.in requirements-packaging.in >> runtime-reqs.txt || true

      - name: Run pip-audit
        run: |
          pip-audit --requirement runtime-reqs.txt --format json \
              --output pip-audit.json || true

      - name: Gate on any CVE
        run: python3 scripts/security_gate.py pip-audit pip-audit.json

      - name: Upload pip-audit report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: pip-audit-report
          path: pip-audit.json
          retention-days: 30
