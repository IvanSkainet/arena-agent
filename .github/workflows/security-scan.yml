name: Security scan

# Runs on every push to master and every PR, plus daily at 06:00 UTC
# so a new CVE in one of our deps trips the alert even without a
# new commit.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: "0 6 * * *"

concurrency:
  group: security-scan-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  bandit:
    name: bandit (must be 0 HIGH / 0 MEDIUM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.12"

      - name: Install bandit
        run: pip install "bandit>=1.7"

      - name: Run bandit
        # -r arena/  = recursive scan of the runtime module.
        # --skip B101 = ignore assert-used; we use asserts inside tests.
        # We do NOT scan tests/ so per-line # nosec markers on test
        # fixtures don't need to be re-annotated (test fixtures often
        # need deliberately-vulnerable shapes to prove they get
        # rejected).
        run: |
          bandit -r arena/ --skip B101 -f json -o bandit.json || true

      - name: Gate on HIGH + MEDIUM (LOW allowed as code hygiene)
        # Delegates to the shared gate script so CI and `make
        # security-scan` locally apply the exact same threshold.
        run: python3 scripts/security_gate.py bandit bandit.json

      - name: Upload bandit report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        if: always()
        with:
          name: bandit-report
          path: bandit.json
          retention-days: 30

  semgrep:
    name: semgrep (9 rule packs, must be 0 findings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.12"

      - name: Install semgrep
        run: pip install "semgrep>=1.170"

      - name: Run semgrep
        # Every finding must be a real ERROR/WARNING. Rule that fires
        # on an OK line is silenced via inline
        # `# nosemgrep: <rule> -- <reason>`, which each existing
        # annotation follows. New nosemgrep additions in a PR require
        # a rationale (grep-visible in code review).
        run: |
          semgrep \
            --config=p/python \
            --config=p/security-audit \
            --config=p/owasp-top-ten \
            --config=p/cwe-top-25 \
            --config=p/insecure-transport \
            --config=p/command-injection \
            --config=p/xss \
            --config=p/secrets \
            --config=p/gitleaks \
            --error --severity=ERROR --severity=WARNING \
            --json --output=semgrep.json \
            arena/ || true

      - name: Gate on any ERROR + WARNING
        run: python3 scripts/security_gate.py semgrep semgrep.json

      - name: Upload semgrep report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        if: always()
        with:
          name: semgrep-report
          path: semgrep.json
          retention-days: 30

  trufflehog:
    name: trufflehog (0 secrets in git history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          fetch-depth: 0  # full history for secret scanning
          persist-credentials: false

      - name: Run trufflehog
        uses: trufflesecurity/trufflehog@afbf580a6ec37188c43b2f3f66b9169484206a2f  # v3.88.27
        with:
          extra_args: --only-verified --json
        continue-on-error: true

  gitleaks:
    name: gitleaks (0 secrets in commits)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7  # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

  osv-scanner:
    name: osv-scanner (Google OSV vulnerability database)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          persist-credentials: false

      - name: Run OSV-Scanner
        uses: google/osv-scanner-action/osv-scanner-action@b00f71e051ddddc6e46a193c31c8c0bf283bf9e6  # v2.1.0
        with:
          scan-args: |-
            --recursive
            .
        continue-on-error: true  # advisory, don't block CI

  sbom-and-grype:
    name: SBOM + Grype vulnerability scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          persist-credentials: false

      - name: Generate SBOM with Syft
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610  # v0
        with:
          format: cyclonedx-json
          output-file: sbom.cyclonedx.json

      - name: Scan SBOM with Grype
        uses: anchore/scan-action@1638637db639e0ade3258b51db49a9a137574c3e  # v6
        with:
          sbom: sbom.cyclonedx.json
          fail-build: false  # advisory
          severity-cutoff: critical

      - name: Upload SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        if: always()
        with:
          name: sbom-cyclonedx
          path: sbom.cyclonedx.json
          retention-days: 30

  socket-firewall:
    name: Socket Firewall (supply-chain malware detection)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.12"

      - name: Install Socket Firewall
        uses: SocketDev/action@2d3f25590c6ed6ba11a9a14c064d962a3a04698f  # v1.3.1
        with:
          mode: firewall-free

      - name: Safe pip install
        run: |
          python3 scripts/extract_runtime_reqs.py > runtime-reqs.txt
          sfw pip install -r runtime-reqs.txt
        continue-on-error: true

  pip-audit:
    name: pip-audit (0 CVE in runtime deps)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: pip install "pip-audit>=2.7"

      - name: Extract runtime deps from pyproject.toml
        # Same helper the Makefile uses, so drift between local +
        # CI runs is impossible.
        run: python3 scripts/extract_runtime_reqs.py > runtime-reqs.txt

      - name: Run pip-audit
        run: |
          pip-audit --requirement runtime-reqs.txt --format json \
              --output pip-audit.json || true

      - name: Gate on any CVE
        run: python3 scripts/security_gate.py pip-audit pip-audit.json

      - name: Upload pip-audit report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        if: always()
        with:
          name: pip-audit-report
          path: pip-audit.json
          retention-days: 30
