# .github/workflows/sign-release.yml
#
# Sign every published release asset, and publish the digests next to them.
#
# Why: until now a download could not be checked. The release page offered
# two zips and nothing to verify them against -- no digest in the body, no
# signature, nothing. Anyone who obtained write access, or intercepted the
# download, could swap the archive and no user could tell. The project ships
# a tool that executes commands on the operator's machine, so "you cannot
# check what you downloaded" is a real gap rather than a formality.
#
# Keyless signing is used deliberately: no private key exists to leak, be
# rotated, or be committed by accident. GitHub mints a short-lived OIDC token
# for this job, Sigstore binds the signature to *this workflow in this
# repository*, and the certificate is recorded in a public transparency log.
# Verification therefore proves the artifact came from this workflow, which
# is a stronger claim than "someone with the key signed it".
#
# This runs on `release: published`, which is what the manual release process
# in RELEASE.md triggers when the assets are uploaded via the API.
name: sign release assets

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to sign (e.g. v4.161.0)"
        required: true
        type: string

# Scorecard Token-Permissions: nothing at the top level; the single job
# declares exactly what it needs.
permissions: {}

jobs:
  sign:
    timeout-minutes: 15
    permissions:
      actions: read     # fetch the accepted exact-SHA candidate evidence
      contents: write   # attach signatures + digest file to the release
      id-token: write   # OIDC token for keyless signing (the whole point)
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner (audit mode, egress visibility)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v2.4.1'

      - name: Resolve tag
        id: tag
        env:
          EVENT_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${EVENT_TAG:-$INPUT_TAG}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::invalid release tag: $TAG"; exit 1
          fi
          if ! gh attestation verify --help | grep -q -- '--source-digest'; then
            echo "::error::GitHub CLI v2.68.0+ is required"; exit 1
          fi
          source_digest=$(gh api \
            "repos/${GITHUB_REPOSITORY}/commits/${TAG}" --jq '.sha')
          if [[ ! "$source_digest" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::could not resolve release tag commit"; exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "source_digest=$source_digest" >> "$GITHUB_OUTPUT"

      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p dist && cd dist
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern '*.zip' --pattern 'arena-bridge.apk'
          versioned="arena-agent-${TAG}.zip"
          alias="arena-agent.zip"
          apk="arena-bridge.apk"
          zip_count=$(find . -maxdepth 1 -name '*.zip' -type f | wc -l)
          if [ "$zip_count" -ne 2 ] || [ ! -f "$versioned" ] \
             || [ ! -f "$alias" ] || [ ! -f "$apk" ]; then
            echo "::error::release must contain exactly $versioned, $alias, and $apk"
            find . -maxdepth 1 -type f -printf '%f\n' | sort
            exit 1
          fi
          cmp "$versioned" "$alias"
          test "$(od -An -tx1 -N2 "$apk" | tr -d ' \n')" = "504b"
          echo "downloaded exact ZIP pair and Android APK"

      - name: Match accepted exact-SHA candidate checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
          SOURCE_DIGEST: ${{ steps.tag.outputs.source_digest }}
        run: |
          set -euo pipefail
          run_id=""
          while IFS=$'\t' read -r id head_sha; do
            if [ "$head_sha" = "$SOURCE_DIGEST" ]; then
              run_id="$id"
              break
            fi
          done < <(
            gh run list --repo "$GITHUB_REPOSITORY" \
              --workflow release-candidate.yml \
              --commit "$SOURCE_DIGEST" \
              --event workflow_dispatch \
              --status success \
              --limit 100 \
              --json databaseId,headSha \
              --jq '.[] | [.databaseId, .headSha] | @tsv'
          )
          if [[ ! "$run_id" =~ ^[0-9]+$ ]]; then
            echo "::error::no successful exact-SHA release candidate run found"
            exit 1
          fi

          accepted="$RUNNER_TEMP/accepted-candidate"
          rm -rf "$accepted"
          mkdir -p "$accepted"
          gh run download "$run_id" --repo "$GITHUB_REPOSITORY" \
            --name "attested-release-candidate-${SOURCE_DIGEST}" \
            --dir "$accepted"
          manifest="$accepted/SHA256SUMS-candidate-${TAG}.txt"
          test -f "$manifest"
          test "$(wc -l < "$manifest")" -eq 3
          sed -E 's/^[0-9a-f]{64}  //' "$manifest" | diff -u \
            <(printf '%s\n' "arena-agent-${TAG}.zip" arena-agent.zip arena-bridge.apk) -
          (cd "$accepted" && sha256sum -c "$(basename "$manifest")")
          (cd dist && sha256sum -c "$manifest")
          cmp "$accepted/arena-agent-${TAG}.zip" "dist/arena-agent-${TAG}.zip"
          cmp "$accepted/arena-agent.zip" dist/arena-agent.zip
          cmp "$accepted/arena-bridge.apk" dist/arena-bridge.apk
          echo "release ZIPs and APK match accepted candidate checksums and bytes"

      - name: Verify source-bound candidate provenance and SBOM
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
          SOURCE_DIGEST: ${{ steps.tag.outputs.source_digest }}
        run: |
          set -euo pipefail
          cd dist
          signer="${GITHUB_REPOSITORY}/.github/workflows/release-candidate.yml"
          for f in "arena-agent-${TAG}.zip" arena-agent.zip arena-bridge.apk; do
            gh attestation verify "$f" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$signer" \
              --source-digest "$SOURCE_DIGEST" \
              --deny-self-hosted-runners
            gh attestation verify "$f" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$signer" \
              --source-digest "$SOURCE_DIGEST" \
              --deny-self-hosted-runners \
              --predicate-type https://spdx.dev/Document/v2.3
          done

      - name: Publish digests
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          cd dist
          sha256sum "arena-agent-${TAG}.zip" arena-agent.zip arena-bridge.apk \
            > "SHA256SUMS-${TAG}.txt"
          test "$(wc -l < "SHA256SUMS-${TAG}.txt")" -eq 3
          cat "SHA256SUMS-${TAG}.txt"

      - name: Sign each asset and the digest file (keyless)
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          COSIGN_YES: "true"
        run: |
          set -euo pipefail
          cd dist
          for f in "arena-agent-${TAG}.zip" arena-agent.zip arena-bridge.apk "SHA256SUMS-${TAG}.txt"; do
            echo "signing $f"
            cosign sign-blob "$f" \
              --output-signature "${f}.sig" \
              --output-certificate "${f}.pem"
          done
          ls -1

      - name: Verify what we just signed
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          cd dist
          # A signing step that never verifies is a signing step nobody has
          # seen work. Prove the bundle validates before it reaches users.
          for f in "arena-agent-${TAG}.zip" arena-agent.zip arena-bridge.apk "SHA256SUMS-${TAG}.txt"; do
            cosign verify-blob "$f" \
              --signature "${f}.sig" \
              --certificate "${f}.pem" \
              --certificate-identity-regexp \
                "^https://github\.com/${GITHUB_REPOSITORY}/\.github/workflows/sign-release\.yml@" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com"
          done
          echo "all signatures verified"

      - name: Attach signatures to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          cd dist
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber \
            ./*.sig ./*.pem "SHA256SUMS-${TAG}.txt"

      - name: Anonymous end-to-end download & smoke verification
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/verify_release && cd /tmp/verify_release
          curl -sSfL "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/arena-agent-${TAG}.zip" \
            -o "arena-agent-${TAG}.zip"
          curl -sSfL "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/arena-agent.zip" \
            -o arena-agent.zip
          curl -sSfL "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/arena-bridge.apk" \
            -o arena-bridge.apk
          curl -sSfL "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/SHA256SUMS-${TAG}.txt" \
            -o "SHA256SUMS-${TAG}.txt"
          sha256sum --check "SHA256SUMS-${TAG}.txt"
          cmp "arena-agent-${TAG}.zip" arena-agent.zip
          test "$(od -An -tx1 -N2 arena-bridge.apk | tr -d ' \n')" = "504b"
          echo "Anonymous ZIP/APK download and SHA256 verification succeeded."
