# Read GitHub clone traffic and propose a normal protected README update.
# Neither unique cloners nor release downloads counts verified human users.
name: traffic badge

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

concurrency:
  group: readme-traffic-refresh
  cancel-in-progress: false

permissions: {}

jobs:
  badge:
    if: github.ref == 'refs/heads/master'
    name: Refresh the unique-clones badge
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden Runner (block mode, egress enforced)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # zizmor artipacked: checkout leaves the token in .git/config,
          # where anything later in the job -- including an uploaded
          # artifact -- can carry it out. This job pushes, so it sets the
          # credential through an ephemeral askpass helper instead.
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Read traffic and update the badge
        env:
          GH_TOKEN: ${{ secrets.README_TRAFFIC_TOKEN }}
        run: python3 scripts/refresh_readme_pr.py
