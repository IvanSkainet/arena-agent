# .github/workflows/version-badge.yml
# v4.64.0: Refresh docs/version.json on every release tag and on every push
# to master (so the dynamic-json badge in README.md always has current data
# sourced from a URL we control, not from shields.io's GitHub API proxy).
name: refresh version badge

on:
  push:
    tags:
      - "v*.*.*"
    branches:
      - master
  workflow_dispatch: {}

# Scorecard Token-Permissions: top-level must grant NOTHING; the single
# job that pushes the badge commit declares its write scope itself.
permissions: {}

jobs:
  refresh:
    permissions:
      contents: write  # bot badge commit + push to master
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner (audit mode, egress visibility)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          fetch-depth: 1
          persist-credentials: true  # needed for git push later

      - name: Resolve current release
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag=$(curl -sS -H "Authorization: token ${GH_TOKEN}" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/latest" \
              | python3 -c "import json,sys; print(json.load(sys.stdin)['tag_name'])")
          fi
          bare="${tag#v}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "bare=${bare}" >> "${GITHUB_OUTPUT}"
          echo "Resolved tag: ${tag}"

      # v4.158.0: the badge could go BACKWARDS. Cutting a release fires this
      # workflow twice -- once for the tag (which knows its own name) and once
      # for the push to master (which asks the API for releases/latest). Those
      # race: measured on v4.158.0, the tag run wrote 4.158.0 at 22:00:14 and
      # the push run overwrote it with 4.157.0 at 22:01:13, because the release
      # only became "latest" at 22:01:22. Both runs were green; the badge just
      # lied. Refusing to move the version down makes the race harmless
      # whichever order the two runs finish in.
      - name: Refuse to move the badge backwards
        id: monotonic
        env:
          VERSION_BARE: ${{ steps.resolve.outputs.bare }}
        run: |
          set -euo pipefail
          python3 - <<'PYEOF'
          import json, os, pathlib

          incoming = os.environ["VERSION_BARE"]

          def parts(v):
              try:
                  return tuple(int(x) for x in v.split("."))
              except ValueError:
                  return ()

          current = ""
          path = pathlib.Path("docs/version.json")
          if path.exists():
              try:
                  current = json.loads(path.read_text()).get("semver", "")
              except (json.JSONDecodeError, OSError):
                  current = ""

          new, old = parts(incoming), parts(current)
          skip = bool(new and old and new < old)
          # v4.169.8: the whole block used to be redirected into GITHUB_OUTPUT,
          # so the `::warning::` line landed in the output file too. GitHub
          # rejects it ("Invalid format") and fails the step -- the guard
          # worked, then killed the job for reporting that it worked. The
          # output file gets only key=value now; the annotation goes to the log.
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"skip={'true' if skip else 'false'}\n")
          if skip:
              print(f"::warning::badge stayed at {current}; {incoming} is older "
                    "(releases/latest lagging behind a tag run)")
          PYEOF

      - name: Write docs/version.json
        if: steps.monotonic.outputs.skip != 'true'
        env:
          # Pass step outputs through env vars to avoid template injection
          VERSION_TAG: ${{ steps.resolve.outputs.tag }}
          VERSION_BARE: ${{ steps.resolve.outputs.bare }}
        run: |
          set -euo pipefail
          mkdir -p docs
          python3 <<'PYEOF'
          import datetime
          import json
          import os
          import pathlib

          # v4.169.31: `updated_at` used to be stamped unconditionally, so
          # the file differed on every run even when the version had not
          # moved. The "commit if changed" step below then always had
          # something to commit: 263 of the last 483 commits on master are
          # badge refreshes, 25 of them repeating v4.164.0 and 25 repeating
          # v4.153.3 -- one line of churn each, burying the real history and
          # forcing a rebase on every push.
          #
          # The timestamp only changes meaning when the version does, so it
          # is preserved when tag_name and semver are unchanged. The file
          # then becomes byte-identical, the existing guard sees nothing to
          # commit, and the run ends silently -- which is what "the badge is
          # already correct" should look like.
          path = pathlib.Path("docs/version.json")
          previous = {}
          if path.exists():
              try:
                  previous = json.loads(path.read_text(encoding="utf-8"))
              except (json.JSONDecodeError, OSError):
                  previous = {}

          tag = os.environ["VERSION_TAG"]
          bare = os.environ["VERSION_BARE"]
          unchanged = (
              previous.get("tag_name") == tag and previous.get("semver") == bare
          )
          stamp = previous.get("updated_at") if unchanged else None
          if not stamp:
              stamp = datetime.datetime.now(
                  datetime.timezone.utc
              ).strftime("%Y-%m-%dT%H:%M:%SZ")

          doc = {"tag_name": tag, "semver": bare, "updated_at": stamp}
          with path.open("w", encoding="utf-8") as fh:
              json.dump(doc, fh, indent=2)
              fh.write("\n")
          print(json.dumps(doc, indent=2))
          PYEOF

      - name: Commit if changed
        if: steps.monotonic.outputs.skip != 'true'
        env:
          VERSION_TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          if [[ -z "$(git status --porcelain docs/version.json)" ]]; then
            echo "version.json is up-to-date, nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/version.json
          git commit -m "chore(badge): refresh version.json to ${VERSION_TAG}"
          git push
