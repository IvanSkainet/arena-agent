# Gitleaks configuration for Skainet Bridge / Arena Agent
title = "gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Allowlisted test fixtures, RFC examples, and retired historical paths"
paths = [
  '''tests/test_observability_redact\.py''',
  '''tests/test_audit_value_redaction\.py''',
  '''tests/test_redaction.*\.py''',
  '''arena/observability/redact\.py''',
  # Scheduled full-history scan (2026-08-13 #31676936942) flagged these
  # as generic-api-key / curl-auth-header. They are fixtures, an RFC 6455
  # example nonce, or files that no longer exist on HEAD.
  '''tests/test_handlers_update_parity_v4_169_39\.py''',
  '''tests/_mcp_description_fingerprint\.json''',
  '''arena/browser/cdp_client/sync_browser\.py''',
  '''scripts/cdp_browser_modules/sync_browser\.py''',
  '''docs/AI_SYSTEM_PROMPT\.md''',
  '''stress-test-v2\.sh''',
  '''memory/facts\.jsonl''',
  '''scripts/cdp_browser\.py''',
  '''tools/superpowers/tests/brainstorm-server/ws-protocol\.test\.js''',
]
regexes = [
  # RFC 6455 section 1.3 example Sec-WebSocket-Key, not a credential.
  # Do not globally allowlist GitHub/Slack token shapes: that would hide
  # a real secret anywhere in history. Redaction fixtures are covered by path.
  '''dGhlIHNhbXBsZSBub25jZQ==''',
]
