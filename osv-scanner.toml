# --- A line of the lock that is never installed -------------------------------
# The locks are resolved for every Python from 3.10 up, so the lock holds two
# filelock lines: 4.3.1 for Python 3.11 and newer, 4.1.0 for Python 3.10.
# Every fixed filelock release needs Python 3.11, so the 3.10 line cannot be
# fixed. requirements-security.lock is installed on Python 3.12 only
# (security-scan.yml); tests/test_every_lock_is_scanned.py fails if that changes.

[[PackageOverrides]]
name = "filelock"
version = "4.1.0"
ecosystem = "PyPI"
vulnerability.ignore = true
effectiveUntil = 2027-01-15T00:00:00Z
reason = "The Python 3.10 line of a universal lock. The lock is installed on Python 3.12 only, where filelock 4.3.1 is taken. No fixed filelock exists for Python 3.10."
