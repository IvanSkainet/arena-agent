# Known advisories that osv-scanner is told to pass, each with a reason and a
# date. On that date the entry stops working and the osv-scanner job goes red
# again, so every entry is looked at again and none stays for ever.
#
# This file applies to the requirement files in the repository root.
#
# How these got here: until #580 the scanner did not read the *.lock files at
# all. Reading them showed advisories in requirements-security.lock, the
# environment the scanners themselves (bandit, pip-audit, semgrep) run in.
# filelock and msgpack were upgraded. The rest is below.

# --- Held back by semgrep ---------------------------------------------------
# semgrep 1.185.0, and 1.186.0 after it, require exactly mcp==1.29.0,
# opentelemetry-api~=1.37.0 and wcmatch~=8.3. No semgrep release allows a
# fixed version, so the lock cannot be moved without dropping semgrep.
#
# What limits the harm: the lock is installed in three jobs of
# security-scan.yml and nowhere else. They run bandit, pip-audit and semgrep over this
# repository with a read-only token and an allowlist of hosts.

[[IgnoredVulns]]
id = "GHSA-qx49-fqc8-xw99"
ignoreUntil = 2027-01-15T00:00:00Z
reason = "mcp 1.29.0, pinned by semgrep. The advisory is about the SDK's OAuth client. The semgrep job only scans files; it starts no MCP client and no MCP server."

[[IgnoredVulns]]
id = "GHSA-84m7-p3x7-pcfv"
ignoreUntil = 2027-01-15T00:00:00Z
reason = "mcp 1.29.0, pinned by semgrep. The advisory is about the StreamableHTTP server transport. The semgrep job only scans files; it starts no MCP server."

